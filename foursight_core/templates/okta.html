<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Foursight authentication</title>
  <style>
    /* Existing Foursight palettes: react/src/Styles.js. Typography, panels and
       controls follow Header.js and css/{index,App}.css; no remote assets. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      --title-bg: #444444;
      --box-bg: #f8f8f8;
      --box-fg: #333333;
      margin: 0;
      background: #fff;
      color: var(--box-fg);
      font: 16px/1.5 Tahoma, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.smaht { --title-bg: #553322; --box-bg: #ffeedd; --box-fg: #221100; }
    body.cgap { --title-bg: #143c53; --box-bg: #ddeeff; --box-fg: #000066; }
    body.fourfront { --title-bg: #14533c; --box-bg: #ddffee; --box-fg: #09430c; }
    .app-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      min-height: 52px;
      padding: 8px 20px;
      background: var(--title-bg);
      color: white;
    }
    .brand { color: yellow; font-size: 24px; }
    .app-title { grid-column: 2; font: bold 26px/1.3 Arial, sans-serif; }
    .section-label {
      padding: 7px 20px;
      border-bottom: 1px solid #ccc;
      background: var(--box-bg);
      font-size: 14px;
    }
    main { width: min(100%, 640px); margin: 64px auto; padding: 0 20px; }
    .auth-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 32px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f8f8f8;
      overflow-wrap: anywhere;
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.5; font-weight: normal; }
    .return-link {
      display: inline-block;
      max-width: 100%;
      margin-top: 24px;
      padding: 10px 18px;
      border: 1px solid var(--box-fg);
      border-radius: 6px;
      background: var(--box-bg);
      color: var(--box-fg);
      text-decoration: none;
      font-weight: bold;
    }
    .return-link:hover { background: var(--box-fg); color: var(--box-bg); }
    .return-link:focus-visible { outline: 3px solid var(--title-bg); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .progress {
      order: -1;
      width: 100px;
      height: 4px;
      margin-bottom: 24px;
      overflow: hidden;
      border-radius: 2px;
      background: var(--box-bg);
    }
    .progress::before {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--box-fg);
      animation: progress 1.5s ease-in-out infinite alternate;
    }
    /* The unchanged bridge reveals #retry on failure; never show a spinner then. */
    #retry:not([hidden]) ~ .progress { display: none; }
    #diagnostic {
      width: 100%;
      margin: 20px 0 0;
      padding: 12px;
      border: 1px solid #a94442;
      border-radius: 4px;
      background: #f2dede;
      color: #843534;
      font: 13px/1.6 Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    @keyframes progress { from { transform: translateX(0); } to { transform: translateX(150%); } }
    @media (prefers-reduced-motion: reduce) { .progress::before { animation: none; } }
  </style>
</head>
<body class="{{ theme }}">
  <header class="app-header">
    {% if brand %}<span class="brand">{{ brand }}</span>{% endif %}
    <span class="app-title">FOURSIGHT</span>
  </header>
  <div class="section-label">Authentication</div>
  <main>
    <section class="auth-panel" aria-labelledby="{% if signed_out %}signed-out{% else %}status{% endif %}">
      {% if signed_out %}
      <h1 id="signed-out">Signed out</h1>
      <a class="return-link" href="{{ base }}/react">Foursight</a>
      {% else %}
      <h1 id="status" role="status" aria-live="polite">Completing sign-in…</h1>
      <a id="retry" hidden class="return-link" href="{{ base }}/react">Return to Foursight</a>
      <div class="progress" aria-hidden="true"></div>
      {% endif %}
    </section>
  </main>
  {% if not signed_out %}
  <script src="{{ base }}/react/okta-auth.js" defer></script>
  {% endif %}
</body>
</html>
